<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `resizes-visual` pins the on-screen keyboard to the visual viewport: the
         layout viewport keeps its height, so the canvas holds its size and the
         board does not re-fit every time the player taps the guess box. The gap
         between the two viewports is what keyboard.js measures. Browsers that
         report the keyboard's geometry are taken off this path entirely; see
         keyboard.js. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>Globle</title>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
      <div id="vignette"></div>

      <div id="hud">
        <!-- On a narrow frame every control below the status pill moves into the
             menu, and the panels move behind it. The controls are the same nodes
             either way -- ui.js re-parents them rather than drawing a second set
             -- so a listener, a disabled state or a hidden flag set anywhere else
             holds across the move without knowing the move happened. -->
        <header id="topbar">
          <div id="status" class="pill"></div>
          <div id="streak" class="pill" hidden></div>
          <div class="spacer"></div>
          <button id="hard-toggle" class="pill button switch" type="button" aria-pressed="false">
            <span id="hard-toggle-label"></span>
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
          </button>
          <button id="dev-reset" class="pill button dev" type="button" hidden>↺ Reset</button>
          <button id="mode-toggle" class="pill button" type="button"></button>
          <button id="view-toggle" class="pill button" type="button"></button>
          <button id="lang-toggle" class="pill button" type="button"></button>

          <div id="menu-wrap" hidden>
            <button
              id="menu-toggle"
              class="pill button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="menu"
            >
              ☰
            </button>
            <div id="menu" hidden>
              <div class="menu-group">
                <button id="menu-guesses" class="button" type="button" aria-pressed="false"></button>
                <button id="menu-players" class="button" type="button" aria-pressed="false"></button>
              </div>
              <div class="menu-group" id="menu-settings"></div>
              <div class="menu-group" id="menu-actions"></div>
            </div>
          </div>
        </header>

        <section id="guesses" class="panel" hidden>
          <div class="panel-head">
            <h2 id="guesses-title"></h2>
            <button id="guesses-close" class="panel-close button" type="button">✕</button>
          </div>
          <ol id="guess-list"></ol>
        </section>

        <!-- The roster is three stacks, one row each per player. The names and
             the counts sit outside the scroller and stay where they are; only
             the middle stack moves, and because every run of squares lives in
             that one container they all move together. -->
        <section id="players" class="panel" hidden>
          <div class="panel-head">
            <h2 id="players-title"></h2>
            <button id="players-close" class="panel-close button" type="button">✕</button>
          </div>
          <div id="roster">
            <ol id="player-names"></ol>
            <div id="player-runs" aria-hidden="true"><div id="player-runs-rows"></div></div>
            <div id="player-scores" aria-hidden="true"></div>
          </div>
        </section>

        <footer id="bottombar">
          <div id="entry">
            <input id="guess-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button id="guess-submit" class="button primary" type="button"></button>
          </div>
          <button id="giveup" class="button subtle" type="button"></button>
          <button id="practice-new" class="button subtle" type="button" hidden></button>
        </footer>

        <div id="message" hidden></div>
      </div>

      <!-- The name behind a roster square. It lives out here rather than beside
           the squares because the run is a horizontal scroller and the panel
           scrolls too, and a tooltip inside either would be clipped by it. Fixed
           to the viewport and placed from the square's own rectangle instead. -->
      <div id="cell-tip" role="tooltip" hidden></div>

      <div id="splash">
        <div id="splash-inner">
          <div id="splash-globe">🌍</div>
          <p id="splash-text">Loading…</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
